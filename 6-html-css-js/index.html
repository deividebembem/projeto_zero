<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerando tabuada</title>
    <link rel="stylesheet" href="tabuada.css">
</head>
<body>
    <h2>Gerador de tabuada</h2>

    <label for="numeroInput">Digite um número: </label>
    <input type="number" id="numero-input" placeholder="Ex.: 5">
    <button id="btn-gerar">Gerar tabuada</button>

    <div id="resultado-aqui">
        <!-- a tabuada será gerada aqui-->
        <!-- só mostrará o conteúdo qunado o scritp.js gera a tabuada -->
    </div>
    <!-- o comando abaixo ira chamar o arquivo .js -->
    <script src="script.js"></script>
</body>
</html>
